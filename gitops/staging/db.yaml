apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unvrs-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: unvrs-staging
  source:
    repoURL: harbor.cloud.retreat480.com/unvrs
    chart: unvrs-db
    targetRevision: 0.1.0-ci.2.1
    helm:
      releaseName: unvrs-db
  destination:
    server: https://kubernetes.default.svc
    namespace: unvrs-staging
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
