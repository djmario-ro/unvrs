version: "3.9"

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guesthouse
      POSTGRES_USER: guesthouse
      POSTGRES_PASSWORD: guesthouse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guesthouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://guesthouse:guesthouse@db:5432/guesthouse
      WHATSAPP_SERVICE_URL: http://whatsapp:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  whatsapp:
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_TOKEN: ${WHATSAPP_API_TOKEN:?Set WHATSAPP_API_TOKEN in .env (shared secret with the backend)}
    volumes:
      - whatsapp_auth:/app/auth
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Internal-only service; the backend reaches it at http://whatsapp:3000.
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  whatsapp_auth:
