apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  cluster:
    name: {{ .Values.clusterName }}
  name: {{ .Values.databaseOwner }}
  login: true
  superuser: false
  createdb: false
  createrole: false
  passwordSecret:
    name: {{ required "existingSecret is required" .Values.existingSecret }}
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .Release.Name }}
spec:
  cluster:
    name: {{ .Values.clusterName }}
  name: {{ .Values.databaseName }}
  owner: {{ .Values.databaseOwner }}
  databaseReclaimPolicy: retain
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-password
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.existingSecret | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-password
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-password
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clusterName }}
    namespace: {{ .Release.Namespace }}
