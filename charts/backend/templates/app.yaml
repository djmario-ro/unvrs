apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations:
        checksum/values: {{ .Values | toJson | sha256sum }}
    spec:
      imagePullSecrets: {{ .Values.imagePullSecrets | toJson }}
      nodeSelector: {{ .Values.nodeSelector | toJson }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          resources: {{ .Values.resources | toJson }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          envFrom:
            - secretRef: {name: {{ .Values.existingSecret }}}
          env:
            - name: HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.homeAssistant.existingSecret }}
                  key: HA_TOKEN
                  optional: true
            - {name: HA_URL, value: {{ .Values.homeAssistant.url | quote }}}
            - {name: FRONTEND_ORIGIN, value: {{ .Values.frontendOrigin | quote }}}
            - {name: COOKIE_SECURE, value: "true"}
            - {name: DEBUG, value: "false"}
