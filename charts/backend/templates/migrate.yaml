apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unvrs-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets: {{ .Values.imagePullSecrets | toJson }}
      nodeSelector: {{ .Values.nodeSelector | toJson }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          resources: {{ .Values.resources | toJson }}
          envFrom:
            - secretRef: {name: {{ .Values.existingSecret }}}
          env:
            - {name: HA_DOOR_SCRIPTS, value: {{ .Values.homeAssistant.doorScripts | toJson | quote }}}
