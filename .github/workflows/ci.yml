name: CI
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: guesthouse
          POSTGRES_PASSWORD: guesthouse
          POSTGRES_DB: guesthouse_test
        ports: ['5433:5432']
        options: >-
          --health-cmd 'pg_isready -U guesthouse -d guesthouse_test'
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test GitOps delivery rules
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend integration tests against disposable PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://guesthouse:guesthouse@localhost:5433/guesthouse_test
        run: python -m pytest -q
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
